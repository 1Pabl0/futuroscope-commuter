name: CI Test & Quality Suite

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Pytest & Linting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r frontend/requirements.txt
        pip install flake8 black

    - name: Run Linting (Black & Flake8)
      run: |
        black --check backend frontend || true
        flake8 backend frontend --max-line-length=120 --ignore=E501,W503 || true

    - name: Run Backend Tests
      run: |
        PYTHONPATH=backend pytest backend/tests -v --cov=app --cov-report=term-missing
